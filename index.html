<script data-file="js/theme-early.js">
// Color theme first, so the page never flashes the wrong colors. Auto follows the device.
var MDB_THEME_KEY = 'mdb.theme.v1';
function mdbThemeApply() {
  var pref = 'auto';
  try { pref = localStorage.getItem(MDB_THEME_KEY) || 'auto'; } catch (e) { /* ignore */ }
  var dark = pref === 'dark' || (pref === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
mdbThemeApply();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<style data-file="css/styles.css">
:root{
  /* beneathtrees palette (light). Dark values are in the "beneathtrees theme" block below. */
  --navy:#1f4a63;--blue:#2c5f7c;--blue-mid:#3b82c4;--blue-light:#eef6fb;
  --blue-pale:#f6fafc;--blue-border:#c9dceb;--blue-border2:#9fc1d9;
  --text:#16323f;--text2:#33495a;--text3:#5a6b7b;--text1:#16323f;
  --border:#dbe4ea;--border2:#c3d0da;
  --white:#ffffff;--bg:#f4f7f8;--surface-2:#f6f8fa;
  --green:#2f7d4f;--green-bg:#eaf6ee;--green-border:#9fd3b0;
  --red:#c53030;--red-bg:#fbeef0;--red-border:#f0a9a9;
  --amber:#8a5a12;--amber-bg:#fdf6e3;--amber-border:#e8cf8a;--amber-bright:#b4580f;
  --purple:#6b3fa0;--purple-bg:#f3eefa;--purple-border:#c9b6e6;
  --sidebar-w:265px;--header-h:60px;
  --font:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --serif:Fraunces,Georgia,'Times New Roman',serif;
  --base:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:var(--base);-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--text);font-family:var(--font);height:100vh;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,textarea{font-family:inherit}
::-webkit-scrollbar{width:7px}::-webkit-scrollbar-thumb{background:var(--blue-border);border-radius:4px}

/* HEADER */
#header{height:var(--header-h);background:var(--navy);display:flex;align-items:center;padding:0 20px;gap:16px;flex-shrink:0}
.logo{font-size:1.45rem;font-weight:800;color:#fff;letter-spacing:-.02em;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .15s;user-select:none;text-decoration:none;display:block}
.logo:hover{opacity:.85}
.logo span{color:#93c5fd}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap input{width:100%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:7px;padding:9px 14px 9px 40px;color:#fff;font-size:1rem;outline:none}
.search-wrap input::placeholder{color:rgba(255,255,255,.45)}
.search-wrap input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4)}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.45);pointer-events:none}
.header-tabs{display:flex;gap:2px;margin-left:auto}
.header-tab{padding:8px 15px;border-radius:7px;font-size:.9rem;font-weight:500;color:rgba(255,255,255,.65);transition:all .15s;white-space:nowrap}
.header-tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.header-tab.active{color:#fff;background:var(--blue)}
.badge{display:inline-flex;align-items:center;justify-content:center;background:var(--white);color:var(--blue);border-radius:99px;font-size:.65rem;font-weight:700;padding:1px 6px;margin-left:4px}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--white);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.sidebar-filters{padding:11px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:7px}
.filter-row{display:flex;gap:4px}
.filter-btn{flex:1;padding:7px 4px;border-radius:6px;font-size:.8rem;font-weight:500;color:var(--text3);background:transparent;border:1px solid var(--border);cursor:pointer;transition:all .15s;text-align:center}
.filter-btn:hover{color:var(--blue);border-color:var(--blue-mid)}
.filter-btn.active{color:var(--blue);border-color:var(--blue);background:var(--blue-light);font-weight:600}
.sidebar-list{flex:1;overflow-y:auto;padding:7px}
.sidebar-section-label{padding:10px 9px 4px;font-size:.72rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text3)}

/* Standard company item */
.company-item{display:flex;align-items:flex-start;gap:9px;padding:9px;border-radius:7px;cursor:pointer;transition:all .15s;margin-bottom:2px;border:1px solid transparent}
.company-item:hover{background:var(--blue-light);border-color:var(--blue-border)}
.company-item.active{background:var(--blue-light);border-color:var(--blue)}
.company-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.dot-active{background:var(--green)}.dot-hist{background:var(--text3)}
.company-item-name{font-size:.95rem;font-weight:600;color:var(--text);line-height:1.3}
.company-item.active .company-item-name{color:var(--blue)}
.company-item-country{font-size:.78rem;color:var(--text3);margin-bottom:3px}
.cat-pills{display:flex;gap:3px;flex-wrap:wrap}
.cat-pill{font-size:.67rem;padding:2px 7px;border-radius:99px;font-weight:600}
.pill-compound{background:var(--blue-light);color:var(--blue)}
.pill-stereo{background:var(--green-bg);color:var(--green)}

/* FEATURED (Big Four) sidebar items */
.company-item.featured-co{
  border-left:4px solid var(--amber-bright);
  background:var(--amber-bg);
  border-color:var(--amber-border);
  padding-left:7px;
}
.company-item.featured-co:hover{background:var(--amber-bg);border-color:var(--amber-bright)}
.company-item.featured-co.active{background:var(--amber-border);border-color:var(--amber-bright)}
.company-item.featured-co .company-item-name{font-size:1rem;font-weight:700;color:var(--navy)}
.company-item.featured-co.active .company-item-name{color:var(--amber)}
.co-star{color:var(--amber-bright);font-size:.85rem;margin-left:2px;flex-shrink:0}

/* MAIN */
#main{flex:1;overflow-y:auto;background:var(--bg);padding-bottom:0;transition:padding-bottom .25s}
.view{padding:24px;animation:fadeUp .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 20px;border-radius:7px;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s;border:none;font-family:inherit}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1d4ed8}
.btn-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-ghost:hover{background:rgba(255,255,255,.22)}
.btn-outline{background:var(--white);color:var(--navy);border:1px solid var(--border2)}
.btn-outline:hover{background:var(--blue-light);border-color:var(--blue);color:var(--blue)}
.btn-danger{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.btn-danger:hover{background:var(--red-bg)}

/* HOME */
.home-hero{background:var(--navy);color:#fff;border-radius:11px;padding:32px 36px;margin-bottom:22px}
.home-hero h1{font-size:2.1rem;font-weight:700;line-height:1.2;margin-bottom:11px}
.home-hero h1 em{font-style:normal;color:#93c5fd}
.home-hero-body{display:flex;gap:28px;align-items:stretch;min-height:260px}
.home-hero-text{flex:1}
.home-hero-text p{color:rgba(255,255,255,.82);font-size:1rem;line-height:1.78;margin-bottom:20px}
.home-photos{display:flex;gap:14px;flex-shrink:0;align-self:stretch}
.photo-card{width:255px;flex-shrink:0;background:rgba(255,255,255,.07);border:2px dashed rgba(255,255,255,.22);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;cursor:default}
.photo-card img{width:100%;flex:1;min-height:0;object-fit:contain;display:block;background:#0c1d35}
.photo-placeholder{width:100%;flex:1;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.04)}
.photo-placeholder-icon{font-size:2.8rem;opacity:.4}
.photo-placeholder-text{font-size:.75rem;color:rgba(255,255,255,.38);text-align:center;line-height:1.5;padding:0 14px}
.photo-card-label{padding:8px 10px;font-size:.78rem;font-weight:600;color:rgba(255,255,255,.65);text-align:center;background:rgba(0,0,0,.22);letter-spacing:.04em;text-transform:uppercase;flex-shrink:0}
.home-feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:22px}
.feature-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;gap:11px}
.feature-card:hover{border-color:var(--blue-mid);box-shadow:0 4px 16px rgba(37,99,235,.1);transform:translateY(-1px)}
.feature-card-icon{font-size:1.8rem;line-height:1}
.feature-card-title{font-size:1.05rem;font-weight:700;color:var(--navy)}
.feature-card-desc{font-size:.92rem;color:var(--text2);line-height:1.7;flex:1}
.feature-card-link{font-size:.88rem;font-weight:600;color:var(--blue);display:flex;align-items:center;gap:4px;margin-top:4px}
.feature-card-link::after{content:'→'}
.home-scope-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-bottom:22px}
.scope-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:17px}
.scope-card-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.scope-card-icon{font-size:1.5rem}
.scope-card-title{font-size:.97rem;font-weight:700;color:var(--navy)}
.scope-card-body{font-size:.88rem;color:var(--text2);line-height:1.72}
.scope-card-stat{margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:.82rem;color:var(--text3)}
.scope-card-stat strong{color:var(--blue)}
.photo-tip{background:var(--blue-light);border:1px solid var(--blue-border);border-left:3px solid var(--blue);border-radius:9px;padding:14px 18px;font-size:.9rem;color:var(--navy);line-height:1.72;margin-bottom:22px}
.photo-tip code{background:rgba(37,99,235,.1);border-radius:4px;padding:1px 6px;font-family:monospace;font-size:.88em}
.home-hero h1{font-size:2.1rem;font-weight:700;line-height:1.2;margin-bottom:11px}
.home-hero h1 em{font-style:normal;color:#93c5fd}
.home-hero p{color:rgba(255,255,255,.8);font-size:1.05rem;line-height:1.72;max-width:580px;margin-bottom:22px}
.quick-actions{display:flex;gap:9px;flex-wrap:wrap}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:20px;text-align:center}
.stat-val{font-size:2.2rem;font-weight:700;color:var(--navy);line-height:1}
.stat-label{font-size:.85rem;color:var(--text3);margin-top:6px}
.section-title{font-size:1.05rem;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.tip-box{background:var(--amber-bg);border:1px solid var(--amber-border);border-left:3px solid var(--amber-bright);border-radius:9px;padding:17px 20px;font-size:.975rem;color:var(--amber);line-height:1.78}
.tip-box strong{color:var(--amber)}
.home-oem-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
.home-oem-card{background:var(--white);border:1px solid var(--border);border-radius:9px;padding:15px;cursor:pointer;transition:all .15s}
.home-oem-card:hover{border-color:var(--blue);background:var(--blue-light)}
.home-oem-card h4{font-size:.975rem;font-weight:700;color:var(--navy);margin-bottom:5px}
.home-oem-card p{font-size:.9rem;color:var(--text2);line-height:1.6}

/* COMPANY */
.company-header{background:var(--white);border:1px solid var(--border);border-radius:11px;padding:24px;margin-bottom:20px}
.company-header.featured-header{border-top:4px solid var(--amber-bright)}
.company-header-top{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.company-flag{font-size:2.4rem;line-height:1}
.company-name{font-size:1.7rem;font-weight:700;color:var(--navy);line-height:1.2;margin-bottom:8px}
.company-meta{display:flex;gap:16px;flex-wrap:wrap}
.company-meta-item{display:flex;align-items:center;gap:4px;font-size:.9rem;color:var(--text3)}
.status-badge{padding:3px 11px;border-radius:99px;font-size:.78rem;font-weight:600}
.status-active{background:var(--green-bg);color:var(--green)}
.status-hist{background:var(--surface-2);color:var(--text3)}
.company-overview{font-size:1rem;color:var(--text2);line-height:1.82;margin-bottom:16px}
.oem-relations{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--border)}
.oem-badge{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;font-size:.875rem;font-weight:500;cursor:pointer;border:1px solid;transition:opacity .15s}
.oem-badge:hover{opacity:.8}
.oem-acquired{background:var(--red-bg);border-color:var(--red-border);color:var(--red)}
.oem-absorbed{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber)}
.oem-supplier{background:var(--blue-light);border-color:var(--blue-border);color:var(--blue)}
.oem-sourced{background:var(--green-bg);border-color:var(--green-border);color:var(--green)}
.oem-note{background:var(--surface-2);border-color:var(--border2);color:var(--text3)}

/* MODELS */
.model-filters{display:flex;gap:7px;margin-bottom:6px;flex-wrap:wrap;align-items:center}
.mag-note{font-size:.78rem;color:var(--text3);margin-bottom:14px;padding:5px 11px;background:var(--bg);border-radius:5px;border-left:2px solid var(--blue-border);display:flex;align-items:center;gap:5px}
.mf-btn{padding:6px 14px;border-radius:99px;font-size:.85rem;font-weight:500;color:var(--text3);border:1px solid var(--border);cursor:pointer;transition:all .15s;background:var(--white)}
.mf-btn:hover{color:var(--blue);border-color:var(--blue)}
.mf-btn.active{color:var(--blue);border-color:var(--blue);background:var(--blue-light);font-weight:600}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.model-card{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column}
.model-card:hover{border-color:var(--blue-mid);box-shadow:0 4px 14px rgba(37,99,235,.1);transform:translateY(-1px)}
.model-card.discontinued-card{background:var(--surface-2);opacity:.95}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.type-badge{font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.03em;text-transform:uppercase}
.type-compound{background:var(--blue-light);color:var(--blue)}
.type-stereo{background:var(--green-bg);color:var(--green)}
.mc-year{font-size:.85rem;color:var(--text3)}
.mc-name{font-size:1.12rem;font-weight:700;color:var(--navy);margin-bottom:4px;line-height:1.25}
.mc-series{font-size:.87rem;color:var(--text3);margin-bottom:9px}
.mc-apps{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.app-tag{font-size:.76rem;padding:3px 8px;border-radius:5px;background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.mc-specs{flex:1;display:flex;flex-direction:column;margin-bottom:13px}
.spec-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem;padding:5px 0;border-bottom:1px solid var(--border)}
.spec-row:last-child{border-bottom:none}
.spec-k{color:var(--text3);flex-shrink:0}
.spec-v{color:var(--text);text-align:right;max-width:185px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sv-yes{color:var(--green);font-weight:600}
.sv-no{color:var(--text3)}

/* PRICE DISPLAY */
.mc-price{display:flex;gap:6px;flex-wrap:wrap;padding:9px 0 11px;border-bottom:1px solid var(--border);margin-bottom:11px}
.price-line{display:flex;align-items:center;gap:5px;font-size:.82rem}
.price-line-label{color:var(--text3);font-weight:500;white-space:nowrap}
.price-line-val{color:var(--navy);font-weight:700}
.price-new-tag{background:var(--green-bg);border:1px solid var(--green-border);border-radius:5px;padding:3px 9px;font-size:.78rem;color:var(--green);font-weight:700}
.price-used-tag{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:5px;padding:3px 9px;font-size:.78rem;color:var(--blue);font-weight:700}
.price-disc-note{font-size:.72rem;color:var(--text3)}

.mc-footer{display:flex;gap:8px;align-items:center;padding-top:11px;border-top:1px solid var(--border);margin-top:auto}
.price-tier{font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px}
.tier-budget{background:var(--green-bg);color:var(--green)}
.tier-mid{background:var(--blue-light);color:var(--blue)}
.tier-premium{background:var(--amber-bg);color:var(--amber)}
.tier-ultra{background:var(--purple-bg);color:var(--purple)}
.cmp-btn{margin-left:auto;padding:4px 12px;border-radius:6px;font-size:.8rem;font-weight:600;border:1px solid var(--border2);color:var(--text3);transition:all .15s;cursor:pointer;background:white}
.cmp-btn:hover,.cmp-btn.added{background:var(--blue-light);color:var(--blue);border-color:var(--blue)}
.oem-src-tag{font-size:.72rem;padding:3px 8px;border-radius:5px;background:var(--blue-light);color:var(--blue);border:1px solid var(--blue-border)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--white);border:1px solid var(--border2);border-radius:11px;width:100%;max-width:760px;max-height:90vh;overflow-y:auto;transform:translateY(12px);transition:transform .2s;box-shadow:0 22px 55px rgba(0,0,0,.13)}
.modal-overlay.open .modal-box{transform:translateY(0)}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;padding:22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--white);z-index:10}
.modal-co-name{font-size:.85rem;color:var(--blue);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.modal-m-name{font-size:1.65rem;font-weight:700;color:var(--navy);line-height:1.2}
.modal-close{width:33px;height:33px;border-radius:7px;background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;border:1px solid var(--border);flex-shrink:0;transition:all .15s;font-size:1.05rem}
.modal-close:hover{background:var(--red-bg);color:var(--red)}
.modal-body{padding:22px}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.modal-price-box{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:14px 18px;margin-bottom:20px;display:flex;gap:24px;flex-wrap:wrap}
.modal-price-item{display:flex;flex-direction:column;gap:3px}
.modal-price-label{font-size:.78rem;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.modal-price-val{font-size:1.05rem;font-weight:700;color:var(--navy)}
.modal-price-val.price-disc{color:var(--text3);font-size:.9rem;font-style:italic}
.modal-sec{margin-bottom:22px}
.modal-sec-title{font-size:.77rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--blue);margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--blue-light)}

.logo{font-family:var(--serif);font-weight:700;letter-spacing:-.01em}
.logo span{color:#a8e0b4}
h1,h2,.section-title,.co-name,.modal-m-name,.bl-hero h2,.home-hero h1,.industry-hero h2,.coll-hero h2{font-family:var(--serif)}
#header{background:#1f4a63}
html[data-theme="dark"] #header{background:#13232e}
.header-tab.active{background:#2c5f7c}
html[data-theme="dark"] .header-tab.active{background:#2f6f95}
html[data-theme="dark"] /* HEADER */
#header { background:#13232e; }
html[data-theme="dark"] .header-tab.active { background:#2f6f95; }
html[data-theme="dark"] .btn-primary { background:#2f6f95; }
html[data-theme="dark"] /* HOME */
.home-hero { background:#13232e; }
html[data-theme="dark"] .coll-btn { background:#2f6f95; }
html[data-theme="dark"] .cmp-table th { background:#13232e; }
html[data-theme="dark"] .oem-tbl th { background:#13232e; }
html[data-theme="dark"] .dot-major { background:#2f6f95; }
html[data-theme="dark"] .ht-bino-only { background:#13232e; }
html[data-theme="dark"] .era-header { background:#13232e; }
html[data-theme="dark"] /* TRAY */
#compare-tray { background:#13232e; }
html[data-theme="dark"] .tray-cmp { background:#2f6f95; }
html[data-theme="dark"] .ft-chip.active { background:#2f6f95; }
html[data-theme="dark"] .ln-cur { background:#13232e; }
html[data-theme="dark"] .dv-tab.active { background:#13232e; }
html[data-theme="dark"] /* toast */
.toast { background:#13232e; }

/* Header actions: theme and help */
@media(min-width:769px){.hamburger{display:none!important}.search-wrap{min-width:220px}}
html[data-theme="dark"] .company-item.featured-co.active{background:#4a3a12}
html[data-theme="dark"] .company-item.featured-co.active .company-item-name{color:#f6d488}
.mdb-head-acts{display:flex;gap:6px;margin-left:10px;flex-shrink:0}
.mdb-head-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font:700 1rem/1 var(--font);display:flex;align-items:center;justify-content:center}
.mdb-head-btn:hover{background:rgba(255,255,255,.22)}
.hamburger span,.hamburger span::before,.hamburger span::after{background:#fff}
.hamburger.is-open span{background:transparent}
/* Page heads, Tools hub, Help */
.mdb-page-head{margin-bottom:18px}
.mdb-page-head h2{font-size:1.7rem;color:var(--navy);margin-bottom:4px}
.mdb-page-head p{color:var(--text3)}
.mdb-group-title{font:600 1.1rem/1.3 var(--serif);color:var(--navy);margin:20px 0 10px}
.mdb-tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mdb-tool-card{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--white);color:var(--text);transition:border-color .15s,box-shadow .15s}
.mdb-tool-card:hover{border-color:var(--blue-mid);box-shadow:0 6px 18px rgba(20,50,70,.1)}
.mdb-tool-icon{font-size:1.6rem;width:44px;height:44px;border-radius:12px;background:var(--blue-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mdb-tool-card b{display:block;font-size:1rem;color:var(--navy)}
.mdb-tool-card small{display:block;font-size:.82rem;color:var(--text3);line-height:1.45;margin-top:2px}
.mdb-help-jump{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.mdb-help-jump button{padding:7px 12px;border-radius:99px;border:1px solid var(--border);background:var(--white);color:var(--text);font-size:.82rem}
.mdb-help-sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.mdb-help-sec h3{font:600 1.15rem/1.3 var(--serif);color:var(--navy);margin-bottom:8px}
.mdb-help-sec dt{font-weight:600;color:var(--text);margin-top:10px}
.mdb-help-sec dd{color:var(--text2);line-height:1.6;font-size:.92rem}
.mdb-faq{border-top:1px solid var(--border);padding:10px 0}
.mdb-faq summary{cursor:pointer;font-weight:600;color:var(--text)}
.mdb-faq p{margin-top:6px;color:var(--text2);line-height:1.6;font-size:.92rem}
/* Online photos */
.mdb-photo{position:relative;flex:1;min-height:150px;display:flex;align-items:center;justify-content:center;background:#0c1d35}
.mdb-photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.mdb-photo .mdb-credit{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;font-size:.6rem;color:#eef3f6;background:rgba(0,0,0,.5);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.photo-card{border-style:solid}
/* Bottom bar and More sheet: phones only */
#mdb-bottom{display:none}
.mdb-sheet-wrap{position:fixed;inset:0;z-index:600;background:rgba(10,20,30,.45);display:none;align-items:flex-end}
.mdb-sheet-wrap.open{display:flex}
.mdb-sheet{width:100%;background:var(--white);border-radius:18px 18px 0 0;padding:8px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.2)}
.mdb-sheet-grab{width:44px;height:5px;border-radius:3px;background:var(--border2);margin:4px auto 10px}
.mdb-more-list button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 6px;font-size:1rem;color:var(--text);border-bottom:1px solid var(--border);text-align:left}
.mdb-more-list button:last-child{border-bottom:none}
.mdb-more-list button span:first-child{font-size:1.25rem;width:28px;text-align:center}
@media(max-width:768px){
  .header-tabs,.mdb-head-acts .mdb-head-btn:first-child{display:none!important}
  .mdb-head-acts{order:1;margin-left:auto}
  .search-wrap{order:3;flex-basis:100%}
  #mdb-bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:450;background:var(--white);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.08)}
  #mdb-bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.66rem;font-weight:600;color:var(--text3);border-radius:10px;position:relative}
  #mdb-bottom button span{font-size:1.2rem;line-height:1}
  #mdb-bottom button.on{color:var(--blue);background:var(--blue-light)}
  #mdb-bottom i{position:absolute;top:2px;right:calc(50% - 22px);font-style:normal;background:var(--red);color:#fff;border-radius:99px;font-size:.6rem;min-width:16px;padding:0 4px;line-height:16px}
  #mdb-bottom i:empty{display:none}
  body{padding-bottom:calc(68px + env(safe-area-inset-bottom))}
  #compare-tray{bottom:calc(62px + env(safe-area-inset-bottom));padding:8px 12px;flex-wrap:wrap}
  .modal-overlay{z-index:620}
  /* Comparison: one card per specification */
  .cmp-table,.cmp-table tbody,.cmp-table tr,.cmp-table td{display:block;width:100%}
  .cmp-table thead tr{display:flex;flex-wrap:wrap;gap:6px}
  .cmp-table thead th:first-child{display:none}
  .cmp-table thead th{flex:1 1 45%;border-radius:10px}
  .cmp-table tbody tr{border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden;background:var(--white)}
  .cmp-table td{border:none!important;padding:7px 12px!important}
  .cmp-table td[data-l]{background:var(--blue-light);font-weight:700;color:var(--navy);font-size:.82rem;letter-spacing:.02em}
  .cmp-table td[data-m]::before{content:attr(data-m);display:block;font-size:.72rem;font-weight:600;color:var(--text3);margin-bottom:1px}
  .cmp-table-wrap{overflow:visible}
  .compare-topbar{flex-wrap:wrap}
  .mdb-tool-grid{grid-template-columns:1fr}
}

/* Tools (v5): model cards, search, finder, decoder, fit */
.mdb-mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mdb-mcard{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:14px;background:var(--white);overflow:hidden}
.mdb-mcard-main{display:flex;flex-direction:column;gap:3px;text-align:left;padding:12px 14px;color:var(--text);flex:1}
.mdb-mcard-main:hover b{color:var(--blue)}
.mdb-mcard-co{font-size:.74rem;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.mdb-mcard-main b{font:600 1.02rem/1.3 var(--serif);color:var(--navy)}
.mdb-mcard-sub{font-size:.8rem;color:var(--text2)}
.mdb-mcard-meta{font-size:.78rem;color:var(--text3);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mdb-mcard-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.mdb-mcard-tags i{font-style:normal;font-size:.7rem;padding:2px 7px;border-radius:99px;background:var(--blue-light);color:var(--blue)}
.mdb-mcard-cmp{border-top:1px solid var(--border);padding:8px;font-size:.8rem;font-weight:600;color:var(--blue)}
.mdb-mcard-cmp.on{background:var(--green-bg);color:var(--green)}
.mdb-why{display:block;margin-top:6px;font-size:.78rem;color:var(--green);line-height:1.5}
.mdb-empty{padding:24px;text-align:center;color:var(--text3);background:var(--white);border:1px dashed var(--border2);border-radius:12px}
.mdb-note{font-size:.8rem;color:var(--text3);margin:12px 0}
.mdb-chip{padding:5px 10px;border-radius:99px;border:1px solid var(--border);background:var(--white);color:var(--text);font-size:.78rem}
.mdb-chip.on{background:#2c5f7c;border-color:#2c5f7c;color:#fff}
html[data-theme="dark"] .mdb-chip.on{background:#2f6f95;border-color:#2f6f95}
.mdb-chips{display:flex;flex-wrap:wrap;gap:5px}
.mdb-sr-layout{display:grid;grid-template-columns:290px 1fr;gap:18px;align-items:start}
.mdb-sr-filters{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;max-height:calc(100vh - 110px);overflow-y:auto}
.mdb-f{display:flex;flex-direction:column;gap:5px;font-size:.78rem;font-weight:600;color:var(--text2)}
.mdb-f input,.mdb-f select,.mdb-dec-in input,.mdb-dec-in select,.mdb-fit-box input,.mdb-fit-box select,.mdb-sr-bar select{font:inherit;font-size:16px;font-weight:400;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text)}
.mdb-yr{display:flex;gap:6px;align-items:center}.mdb-yr input{width:100%}
.mdb-sr-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;font-size:.85rem;color:var(--text3)}
.mdb-sr-toggle{display:none}
.mdb-fn-prog{display:flex;gap:6px;margin-bottom:14px}.mdb-fn-prog span{flex:1;height:6px;border-radius:3px;background:var(--border)}
.mdb-fn-prog span.done{background:var(--green)}.mdb-fn-prog span.cur{background:var(--blue-mid)}
.mdb-fn-card{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:18px;max-width:720px}
.mdb-fn-card h3{font:600 1.3rem/1.3 var(--serif);color:var(--navy);margin-bottom:12px}
.mdb-fn-opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.mdb-fn-opt{text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--border2);background:var(--white);color:var(--text);font-size:.92rem}
.mdb-fn-opt:hover{border-color:var(--blue-mid)}
.mdb-fn-opt.on{background:var(--blue-light);border-color:var(--blue-mid);font-weight:600}
.mdb-fn-nav{display:flex;justify-content:space-between;margin-top:14px}
.mdb-advice{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:12px;padding:12px 14px;margin-bottom:14px;line-height:1.6;font-size:.92rem;color:var(--text)}
.mdb-dec-in{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.mdb-dec-in input{flex:1;min-width:240px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem}
.mdb-dec-in label{font-size:.8rem;color:var(--text3);display:flex;gap:6px;align-items:center}
.mdb-dec-ex{font-size:.78rem;color:var(--text3);margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mdb-dec-ex button{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.76rem;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--white);color:var(--text)}
.mdb-dec-rows{display:grid;gap:8px;margin-bottom:14px}
.mdb-dec-row{display:grid;grid-template-columns:150px 170px 1fr;gap:10px;align-items:baseline;background:var(--white);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.mdb-dec-row span{font-size:.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.mdb-dec-row b{color:var(--navy)}.mdb-dec-row p{color:var(--text2);font-size:.88rem;line-height:1.5}
.mdb-fit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.mdb-fit-box{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mdb-fit-box h3{font:600 1.05rem/1.3 var(--serif);color:var(--navy)}
.mdb-fit-row{display:flex;gap:10px;flex-wrap:wrap}.mdb-fit-row label{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--text3);flex:1}
.mdb-fit-sys{font-size:.85rem;color:var(--text2);line-height:1.5}.mdb-fit-sys b{display:block;color:var(--navy)}
.mdb-fit-verdict{font:700 1.2rem/1.3 var(--serif);padding:12px 14px;border-radius:12px;margin-bottom:8px}
.mdb-fit-res{padding:10px 12px;border-radius:10px;margin-bottom:6px;border-left:4px solid var(--border2);background:var(--white)}
.mdb-fit-res b{color:var(--text)}.mdb-fit-res p{font-size:.88rem;color:var(--text2);margin-top:2px;line-height:1.5}
.mdb-fit-ok{border-left-color:var(--green)}.mdb-fit-warn{border-left-color:var(--amber-bright)}.mdb-fit-bad{border-left-color:var(--red)}
.mdb-fit-verdict.mdb-fit-ok{background:var(--green-bg);color:var(--green)}.mdb-fit-verdict.mdb-fit-warn{background:var(--amber-bg);color:var(--amber)}.mdb-fit-verdict.mdb-fit-bad{background:var(--red-bg);color:var(--red)}
@media(max-width:768px){
  .mdb-sr-layout{grid-template-columns:1fr}
  .mdb-sr-filters{display:none;position:static;max-height:none}.mdb-sr-filters.open{display:flex}
  .mdb-sr-toggle{display:inline-block}
  .mdb-dec-row{grid-template-columns:1fr}.mdb-fit-grid{grid-template-columns:1fr}
}

/* Identify, serials, buying, history, model photos (v5) */
.mdb-id-grid{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.mdb-serial{background:var(--blue-light);border:1px solid var(--blue-border);border-radius:12px;padding:10px 12px;font-size:.88rem;line-height:1.5;color:var(--text2)}
.mdb-serial span{display:block;font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.mdb-serial b{font:700 1.3rem/1.3 var(--serif);color:var(--navy)}
.mdb-serial a,.mdb-p a,.mdb-story a,.mdb-list a,.mdb-more-link{color:var(--blue);cursor:pointer;text-decoration:underline}
.mdb-p{color:var(--text2);line-height:1.6;font-size:.92rem;margin-top:4px}
.mdb-letters{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;font-size:.86rem;color:var(--text2)}
.mdb-letters b{display:inline-block;width:22px;color:var(--navy)}
.mdb-list{padding-left:20px;color:var(--text2);line-height:1.65;font-size:.92rem}.mdb-list li{margin:3px 0}
.mdb-quick{display:flex;gap:8px;flex-wrap:wrap}
.mdb-more-link{display:inline-block;margin-top:6px;font-size:.85rem}
.mdb-hist-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
.mdb-hist-bar select{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--white);color:var(--text)}
.mdb-story{list-style:none;border-left:3px solid var(--blue-border);margin:0 0 10px 8px;padding:0}
.mdb-story li{display:flex;gap:12px;padding:8px 0 8px 14px;position:relative}
.mdb-story li::before{content:'';position:absolute;left:-8px;top:14px;width:13px;height:13px;border-radius:50%;background:var(--white);border:3px solid var(--blue-mid)}
.mdb-story li.ev-acquisition::before,.mdb-story li.ev-merger::before{border-color:var(--purple)}
.mdb-story li.ev-split::before{border-color:var(--red)}
.mdb-story li.ev-oem::before{border-color:var(--amber-bright)}
.mdb-story span{font:700 1rem/1.4 var(--serif);color:var(--navy);min-width:48px}
.mdb-story b{color:var(--text)}.mdb-story p{color:var(--text2);font-size:.88rem;line-height:1.55;margin-top:2px}
.mdb-tl{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:10px 12px}
.mdb-tl-axis{position:relative;height:20px;margin-left:34%;margin-right:84px;border-bottom:1px solid var(--border)}
.mdb-tl-axis span{position:absolute;transform:translateX(-50%);font-size:.68rem;color:var(--text3)}
.mdb-tl-row{display:flex;align-items:center;width:100%;gap:8px;padding:3px 0;text-align:left;color:var(--text)}
.mdb-tl-row:hover .mdb-tl-name{color:var(--blue)}
.mdb-tl-name{width:34%;font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.mdb-tl-track{position:relative;flex:1;height:12px;background:var(--surface-2);border-radius:6px}
.mdb-tl-bar{position:absolute;top:0;bottom:0;border-radius:6px;background:var(--blue-mid)}
.mdb-tl-bar.mdb-tl-stereo{background:var(--green)}.mdb-tl-bar.unknown{opacity:.4}
.mdb-tl-yr{width:76px;font-size:.7rem;color:var(--text3);text-align:right;flex-shrink:0}
.mdb-mphotos{display:flex;gap:8px;overflow-x:auto;margin-bottom:10px}
.mdb-mphotos:empty{display:none}
.mdb-mphotos figure{position:relative;flex:0 0 auto;width:210px;margin:0}
.mdb-mphotos img{width:210px;height:160px;object-fit:cover;border-radius:10px;background:var(--surface-2);display:block}
.mdb-mphotos figcaption{font-size:.66rem;color:var(--text3);margin-top:3px;line-height:1.3}
.mdb-mphotos figcaption a{color:var(--text3)}
.mdb-mphotos .mdb-note{flex:0 0 160px;font-size:.7rem;align-self:center}
.mdb-author{position:absolute;left:6px;top:6px;background:rgba(31,74,99,.88);color:#fff;font-size:.66rem;padding:2px 7px;border-radius:10px}
@media(max-width:768px){.mdb-id-grid{grid-template-columns:1fr}.mdb-tl-axis{margin-left:40%;margin-right:60px}.mdb-tl-name{width:40%}.mdb-tl-yr{width:56px}}
/* Learn (v5) */
.mdb-learn-tabs{margin:0 0 14px}
.mdb-learn-note{color:var(--text2);font-size:.92rem;line-height:1.6;margin:0 0 10px}
.mdb-learn-note a,.mdb-help-sec a{color:var(--blue);cursor:pointer;text-decoration:underline}
.mdb-gloss{margin:12px 0 0}
.mdb-gloss dt{font-weight:600;color:var(--navy);margin-top:12px}
.mdb-gloss dd{margin:2px 0 0;color:var(--text2);line-height:1.6;font-size:.92rem}
.mdb-steps{margin:8px 0 0;padding-left:22px}
.mdb-steps li{margin:0 0 10px;color:var(--text)}
.mdb-steps p{margin:2px 0 0;color:var(--text2);line-height:1.6;font-size:.92rem}
.mdb-tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.mdb-table{width:100%;border-collapse:collapse;font-size:.88rem}
.mdb-table th,.mdb-table td{border-bottom:1px solid var(--border);padding:8px 10px;text-align:left;vertical-align:top;color:var(--text)}
.mdb-table thead th{background:var(--blue-pale);color:var(--navy);font-weight:600}
.mdb-table tbody th{font-weight:600;color:var(--navy);white-space:nowrap}
.mdb-table small{display:block;font-weight:400;color:var(--text3);font-size:.75rem}
.mdb-table a{color:var(--blue);cursor:pointer}
@media (max-width:700px){
  .mdb-table thead{display:none}
  .mdb-table tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 0}
  .mdb-table tbody th{display:block;border:0;white-space:normal}
  .mdb-table td{display:block;border:0;padding:4px 10px}
  .mdb-table td::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
}
.mdb-stand-tags{display:flex;flex-wrap:wrap;gap:6px}
.mdb-xlink{color:var(--blue);text-decoration:underline}
</style>
</head>
<body>
<div id="header">
  <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
    <span></span>

  overview:"Nikon Corporation traces its roots to July 25, 1917, when three Japanese optical manufacturers merged to form Nippon Kogaku K.K. — a government-supported initiative to build a domestic precision optics industry independent of German imports, backed by Mitsubishi’s Koyata Iwasaki. The company officially became Nikon Corporation in 1988. Microscopy milestones: Japan’s first microscope with revolving nosepiece (the Joico, 1925); the CF (Chrome-Free) optical system in the 1970s, which eliminated chromatic aberration across the full objective-to-eyepiece optical path — a significant advance over prior designs that corrected chromatic errors only within the objective; the Optiphot and Labophot research uprights (1978); the Diaphot inverted (1980s) — used in the first IVF procedures in the UK and USA and later in the cloning of Dolly the sheep (1996); the CFI60 infinity optical system (1994) with long working distances and high NA objectives that remain industry-leading; and the Ti/Ti2 inverted research series which became the dominant live-cell imaging platform globally. Nikon introduced two of the most important super-resolution technologies: N-SIM (structured illumination, licensed from UCSF) and N-STORM (stochastic optical reconstruction, licensed from Harvard), both on the Eclipse Ti platform. Nikon is the only major microscope manufacturer that produces its own optical glass, providing end-to-end quality control.",

<script data-file="js/util.js">
// SHARED STATE AND HELPERS
const S = { view: 'home', co: null, cat: 'all', st: 'all', q: '', mf: 'all', ff: [], cmp: [], modal: null, baseHash: '#/', rendered: false, dv: { tab: 'review', brand: '' } };
const G = id => DB.companies.find(c => c.id === id);
const GM = (cid, mid) => { const c = G(cid); return c ? c.models.find(m => m.id === mid) : null };
const inC = (cid, mid) => S.cmp.some(i => i.c === cid && i.m === mid);
const pillLabel = { compound: 'Compound', stereo: 'Stereo' };
const pills = cats => (cats || []).map(c => `<span class="cat-pill pill-${c}">${pillLabel[c] || c}</span>`).join('');
const tierLbl = t => ({ budget: 'Budget', mid: 'Mid-Range', premium: 'Premium', ultra: 'Ultra' }[t] || t);
const KIND_LABEL = { macroscope: 'Macroscope', digital: 'Digital', surgical: 'Surgical', slide_scanner: 'Slide scanner', laser_scanning: 'Laser scanning', super_resolution: 'Super-resolution' };
const kindLbl = k => KIND_LABEL[k] || k;
const FEATURES = [{ k: 'fluorescence', label: 'Fluorescence' }, { k: 'phase_contrast', label: 'Phase' }, { k: 'dic', label: 'DIC' }, { k: 'inverted', label: 'Inverted' }, { k: 'motorized', label: 'Motorized' }];
const featLabel = k => (FEATURES.find(f => f.k === k) || { label: k }).label;

// Introduction year, with a tilde when it is approximate.
const introLabel = m => (m.introduced_approx ? '~' : '') + m.introduced;
// Discontinued label: " (disc. 1990)", " (disc. ~1987)" for an estimate, " (disc.)" when the year is unknown.
function discLabel(m) { if (!m.discontinued) return ''; const y = m.discontinued_year; return y ? ` (disc. ${m.discontinued_approx ? '~' : ''}${y})` : ' (disc.)'; }

// Escape text typed by the visitor (search box, saved list). Data from the data files is trusted, as before.
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const CONF_TITLE = { verified: 'Checked against the source cited here', cited: 'Taken from a source cited in the research notes; not re-checked', approx: 'Approximate: from general knowledge, not yet checked against a manual or brochure' };
const confBadge = c => `<span class="conf conf-${c}" title="${CONF_TITLE[c] || ''}">${c === 'approx' ? 'approx.' : c}</span>`;
const sugBadge = c => `<span class="sug sug-${c}" title="How sure the suggestion is">${c} confidence</span>`;

// ---- derived indexes, built once after the data has loaded ----
MDB.derive = function () {
  const add = (map, k, v) => { (map.get(k) || map.set(k, []).get(k)).push(v); };
  MDB.byModel = new Map(); DB.companies.forEach(c => c.models.forEach(m => MDB.byModel.set(m.id, { co: c, m })));
  MDB.srcById = new Map(DB.sources.map(s => [s.id, s]));
  MDB.opticsOf = new Map();
  DB.optics.forEach(o => o.models.forEach(e => add(MDB.opticsOf, typeof e === 'string' ? e : e.id, { o, note: typeof e === 'string' ? '' : (e.note || '') })));
  MDB.lineageOf = new Map();
  const flat = n => Array.isArray(n) ? n.flatMap(flat) : [n];
  const norm = n => typeof n === 'string' ? { id: n, name: (MDB.byModel.get(n) || { m: { name: n } }).m.name } : { name: n.name, ghost: true };
  DB.lineage.forEach(l => { const groups = l.chain.map(g => flat(g).map(norm)); groups.forEach((g, i) => g.forEach(n => { if (n.id) add(MDB.lineageOf, n.id, { entry: l, groups, idx: i, prev: groups[i - 1] || [], next: groups[i + 1] || [] }); })); });
  MDB.reviewIdx = new Map();
  DB.review.filter(r => r.status === 'open').forEach(r => add(MDB.reviewIdx, r.scope + ':' + r.target, r));
  MDB.reviewFor = (scope, id) => MDB.reviewIdx.get(scope + ':' + id) || [];
};
const hasNotes = id => MDB.reviewFor('model', id).length > 0;

// One-line text versions used by the compare table
function opticsLine(o) {
  const sys = o.system === 'finite' ? `Finite, ${o.tube_length_mm} mm tube` : `Infinity${o.tube_lens_mm ? `, ${o.tube_lens_mm} mm tube lens` : ''}`;
  return `${sys} · ${o.thread} thread · ${o.parfocal_mm ? o.parfocal_mm + ' mm parfocal' : 'parfocal n/a'}`;
}
function opticsText(m) {
  const l = MDB.opticsOf.get(m.id); if (!l) return '—';
  return l.map(({ o, note }) => `${opticsLine(o)}${note ? ' (' + note.replace(/\.$/, '') + ')' : ''}`).join('<br>') + ' ' + confBadge('approx');
}
function lineageText(m) {
  const l = MDB.lineageOf.get(m.id); if (!l) return '—';
  const nm = n => n.name + (n.ghost ? ' (not listed)' : '');
  return l.map(e => `${e.prev.map(nm).join(' / ') || '—'} → <strong>this</strong> → ${e.next.map(nm).join(' / ') || '—'}`).join('<br>');
}

</script>
<script data-file="js/search.js">
// SEARCH AND FILTERS — text search across brands, models and specs, plus feature chips.
function tokens(q) { return (q || '').toLowerCase().split(/\s+/).filter(Boolean) }
function modelHay(m) {
  if (!m._h) m._h = [m.name, m.series, m.subtype, m.kind ? kindLbl(m.kind) : '', (m.applications || []).join(' '), m.magnification, m.objectives, m.eyepieces, (m.illumination || []).join(' '), m.stage, m.software, m.noteworthy, m.introduced].filter(Boolean).join(' ').toLowerCase();
  return m._h;
}
const brandHay = c => (c.name + ' ' + c.shortName + ' ' + c.country).toLowerCase();
const featOk = m => S.ff.every(k => m[k]);
// A model matches when it has every selected feature and every search word appears in its brand name or its specs.
function modelOk(co, m) {
  if (!featOk(m)) return false;
  const t = tokens(S.q); if (!t.length) return true;
  const h = brandHay(co) + ' ' + modelHay(m);
  return t.every(x => h.includes(x));
}
function filtered() {
  return DB.companies.filter(c => {
    if (S.cat !== 'all' && !c.categories.includes(S.cat)) return false;
    if (S.st !== 'all' && c.status !== S.st) return false;
    if (S.q || S.ff.length) return c.models.some(m => modelOk(c, m));
    return true;
  });
}
function renderFeatureChips() {
  const el = document.getElementById('ft-filters'); if (!el) return;
  el.innerHTML = FEATURES.map(f => `<button class="ft-chip${S.ff.includes(f.k) ? ' active' : ''}" onclick="toggleFeature('${f.k}')" aria-pressed="${S.ff.includes(f.k)}">${f.label}</button>`).join('');
}
function refreshMain() {
  renderSidebar();
  if (S.view !== 'browse') return;
  const main = document.getElementById('main');
  S.co ? renderCo(main) : renderBrowseLanding(main);
}
function toggleFeature(k) {
  const i = S.ff.indexOf(k); i >= 0 ? S.ff.splice(i, 1) : S.ff.push(k);
  renderFeatureChips();
  if (S.view !== 'browse' && S.ff.length) { S.co = null; nav('#/browse'); return; }
  refreshMain();
}
function clearFilters() {
  S.q = ''; S.ff = []; const g = document.getElementById('global-search'); if (g) g.value = '';
  renderFeatureChips(); refreshMain();
}
function searchAll() { S.co = null; nav('#/browse'); }
let _searchTimer;
function handleSearch(v) {
  clearTimeout(_searchTimer); S.q = v;
  _searchTimer = setTimeout(() => {
    if (S.q.trim() && S.view !== 'browse') { S.co = null; nav('#/browse'); return; }
    refreshMain();
  }, 160);
}
function filterNote(co, mods) {
  if (!S.q && !S.ff.length) return '';
  return `<div class="filter-note">Filtering ${co.shortName}${S.q ? ` for “${esc(S.q)}”` : ''}${S.ff.length ? ` with ${S.ff.map(featLabel).join(' + ')}` : ''}: ${mods.length} of ${co.models.length} models. <a onclick="searchAll()">Search all brands</a> · <a onclick="clearFilters()">Clear</a></div>`;
}
// Cross-brand results, shown on the Browse page when no brand is selected and a search or feature filter is active.
function renderFinder(el) {
  const groups = [];
  DB.companies.forEach(c => {
    if (S.cat !== 'all' && !c.categories.includes(S.cat)) return;
    if (S.st !== 'all' && c.status !== S.st) return;
    const ms = c.models.filter(m => modelOk(c, m) && (S.cat === 'all' || m.type === S.cat));
    if (ms.length) groups.push({ c, ms });
  });
  const total = groups.reduce((s, g) => s + g.ms.length, 0);
  const what = `${S.q ? ` matching “${esc(S.q)}”` : ''}${S.ff.length ? ` with ${S.ff.map(featLabel).join(' + ')}` : ''}`;
  el.innerHTML = `<div class="view"><div class="finder-head"><div><h2>Model search</h2><p>${total} model${total !== 1 ? 's' : ''} in ${groups.length} brand${groups.length !== 1 ? 's' : ''}${what}.</p></div><button class="btn btn-outline" onclick="clearFilters()">Clear filters</button></div>
${total ? groups.map(g => `<div class="section-title">${g.c.flag} ${g.c.name} <span class="finder-count">${g.ms.length}</span></div><div class="model-grid">${g.ms.map(m => modelCard(g.c, m)).join('')}</div>`).join('') : `<div class="empty-state"><h3>No models match</h3><p>Try fewer words, or remove a feature filter.</p></div>`}</div>`;
}

<script data-file="js/sections.js">

<div class="opt-grid"><div><span>System</span>${sys}</div><div><span>Thread</span>${o.thread}</div><div><span>Parfocal</span>${o.parfocal_mm ? o.parfocal_mm + ' mm' : '—'}</div></div>
${note ? `<div class="opt-note">This model: ${note}</div>` : ''}${o.notes ? `<div class="opt-note">${o.notes}</div>` : ''}
${same.length ? `<div class="opt-same"><span>Same optical generation in this database (${same.length}):</span><div class="lk-row">${shown}${same.length > 14 ? `<em>+${same.length - 14} more</em>` : ''}</div></div>` : ''}
${o.source ? srcChips([o.source]) : ''}</div>`;

function renderLineage(m) {

const fmtVal = v => v == null ? '—' : Array.isArray(v) ? v.join('; ') : typeof v === 'boolean' ? (v ? 'Yes' : 'No') : String(v);
function targetLink(r) {
  if (r.scope === 'model') { const x = MDB.byModel.get(r.target); return x ? `<a class="lk" onclick="openModal('${x.co.id}','${x.m.id}')">${x.co.shortName}: ${x.m.name}</a>` : r.target; }

function renderNotes(m) {

<script data-file="js/mylist.js">
// MY LIST — a personal list saved in this browser (localStorage), with JSON export/import.
// The published "My Collection" (data/collection.js) is separate and read-only.
const ML = {
  key: 'mdb.mylist.v1',
  read() { try { const a = JSON.parse(localStorage.getItem(this.key) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; } },
  write(a) { try { localStorage.setItem(this.key, JSON.stringify(a)); return true; } catch (e) { return false; } },
  available() { try { localStorage.setItem('mdb.test', '1'); localStorage.removeItem('mdb.test'); return true; } catch (e) { return false; } },
  has(c, m) { return this.read().some(x => x.c === c && x.m === m); },
  toggle(c, m) {
    const a = this.read(), i = a.findIndex(x => x.c === c && x.m === m);
    if (i >= 0) a.splice(i, 1); else a.push({ c, m, sn: '', note: '', added: new Date().toISOString().slice(0, 10) });
    return this.write(a);
  },
  update(c, m, field, val) { const a = this.read(), x = a.find(y => y.c === c && y.m === m); if (!x) return; x[field] = String(val).slice(0, 500); this.write(a); }
};
function toggleMyList(c, m) {
  if (!ML.toggle(c, m)) { alert('This browser is not allowing MicroscopeDB to save a list (private browsing or blocked storage).'); return; }
  const b = document.getElementById('mlist'); if (b) b.textContent = ML.has(c, m) ? '★ In My List' : '☆ Add to My List';
  if (S.view === 'collection') refreshMyList();
}
function myListHTML() {
  if (!ML.available()) return `<div class="ml-box"><h3>Your list</h3><p class="ml-note">Saving is not available in this browser mode, so a personal list can't be kept here.</p></div>`;
  const items = ML.read().map(x => ({ x, r: MDB.byModel.get(x.m) })).filter(i => i.r && i.r.co.id === i.x.c);
  const rows = items.map(({ x, r }) => `<div class="ml-row"><div class="ml-name"><a class="lk" onclick="openModal('${x.c}','${x.m}')">${r.co.shortName} ${r.m.name}</a><span>${introLabel(r.m)}${discLabel(r.m)}</span></div>
<input class="ml-in" placeholder="Serial number" value="${esc(x.sn)}" onchange="ML.update('${x.c}','${x.m}','sn',this.value)" aria-label="Serial number">
<input class="ml-in ml-wide" placeholder="Notes (condition, accessories…)" value="${esc(x.note)}" onchange="ML.update('${x.c}','${x.m}','note',this.value)" aria-label="Notes">
<button class="btn btn-outline ml-rm" onclick="toggleMyList('${x.c}','${x.m}')">Remove</button></div>`).join('');
  return `<div class="ml-box"><div class="ml-head"><h3>Your list <span class="ml-count">${items.length}</span></h3><div class="ml-actions"><button class="btn btn-outline" onclick="mlExport()">Export</button><label class="btn btn-outline ml-import">Import<input type="file" accept="application/json,.json" onchange="mlImport(this)" hidden></label></div></div>
<p class="ml-note">Saved only in this browser. Use <strong>Add to My List</strong> on any model. Export to back it up or move it to another device.</p>${rows || '<div class="ml-empty">Nothing here yet. Open any model and choose “Add to My List”.</div>'}</div>`;
}
function mountMyList(main) { const host = main.querySelector('.coll-view'); if (host) host.insertAdjacentHTML('beforeend', '<div id="ml-host">' + myListHTML() + '</div>'); }
function refreshMyList() { const h = document.getElementById('ml-host'); if (h) h.innerHTML = myListHTML(); }
function mlExport() {
  const blob = new Blob([JSON.stringify({ app: 'MicroscopeDB', list: ML.read() }, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'microscopedb-my-list.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function mlImport(input) {
  const f = input.files && input.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const j = JSON.parse(rd.result), arr = Array.isArray(j) ? j : j.list; if (!Array.isArray(arr)) throw new Error('no list');
      const cur = ML.read(); let added = 0;
      arr.forEach(x => { if (x && GM(x.c, x.m) && !cur.some(y => y.c === x.c && y.m === x.m)) { cur.push({ c: x.c, m: x.m, sn: String(x.sn || '').slice(0, 500), note: String(x.note || '').slice(0, 500), added: String(x.added || '').slice(0, 10) }); added++; } });
      ML.write(cur); refreshMyList(); toast(`Imported ${added} item${added !== 1 ? 's' : ''}`);
    } catch (e) { alert('That file is not a MicroscopeDB list.'); }
    input.value = '';
  };
  rd.readAsText(f);
}

</script>

function renderAccessories(acc){
  if(!acc) return '';
  const secs={stands:'Stands & Bases',heads:'Observation Heads',condensers:'Condensers',fluorescence:'Fluorescence & Illumination',cameras:'Camera & Documentation',teaching:'Teaching Accessories',illumination:'Illumination',auxiliary_objectives:'Auxiliary Objectives',eyepieces:'Eyepieces'};

function renderOEM(main){
  const lbl={merger:'Merger',acquisition:'Acquisition',oem:'OEM Supply',rebrand:'Rebrand / Spin-off',split:'Split / Partition',name_change:'Rename / Rebrand',milestone:'Product Milestone',transfer:'Service Transfer'};
  const groupOrder=['zeiss','leica','leitz','wild','reichert','bausch','olympus','nikon','ao','deltavision','vickers','motic','labomed','meiji','national-optical'];
  const groups={};
  DB.oem_relations.forEach(r=>{const key=r.source;if(!groups[key])groups[key]=[];groups[key].push(r);});
  const legend=Object.entries(lbl).map(([k,v])=>`<span class="rel-pill rel-${k}">${v}</span>`).join(' ');
  const buildGroup=coId=>{
    const entries=groups[coId];
    if(!entries||!entries.length) return '';

    const name=co?`${co.flag} ${co.name}`:coId;
    const rows=entries.map(r=>{
      const src=G(r.source),tgt=G(r.target),self=r.source===r.target;
      const srcLink=src?`<span class="oem-co-link" onclick="selCo('${src.id}')">${src.flag} ${src.shortName}</span>`:r.source;
      const tgtLink=tgt&&!self?`<span class="oem-co-link" onclick="selCo('${tgt.id}')">${tgt.flag} ${tgt.shortName}</span>`:(self?'<em style="color:var(--text3)">Internal</em>':r.target);
      return `<tr class="r-${r.type}"><td><span class="rel-pill rel-${r.type}">${lbl[r.type]||r.type}</span></td><td>${srcLink}</td><td>${tgtLink}</td><td style="color:var(--text3);white-space:nowrap">${r.year||'—'}</td><td style="line-height:1.6">${r.description}${srcChips(r.sources)}</td></tr>`;
    }).join('');
    return `<div class="industry-group"><div class="industry-group-head"><span class="industry-group-name">${name}</span><span class="industry-group-count">${entries.length} event${entries.length!==1?'s':''}</span></div><div class="oem-tbl-wrap"><table class="oem-tbl"><thead><tr><th style="width:130px">Event Type</th><th style="width:160px">From</th><th style="width:160px">To / Result</th><th style="width:58px">Year</th><th>What Happened</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  };
  const allGrouped=groupOrder.map(buildGroup).join('');
  const remaining=Object.keys(groups).filter(k=>!groupOrder.includes(k)).map(buildGroup).join('');
  main.innerHTML=`<div class="view"><div class="industry-hero"><h2>🌎 Industry Genealogy &amp; Corporate History</h2><p>The complete corporate lineage of every manufacturer in the database — mergers, acquisitions, Cold War splits, OEM supply chains, rebrands, and name changes. Understanding these relationships is essential for buyers: an instrument sold under one brand may be optically identical to a product at a very different price under another name.</p></div><div class="oem-legend">${legend}</div>${allGrouped}${remaining}</div>`;
}

}
function dvSources() {
  const card = s => `<div class="src-card"><div class="src-top">${s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.title}</a>` : `<strong>${s.title}</strong>`}<span class="conf conf-${s.checked}">${s.checked}</span></div><div class="src-pub">${s.publisher}${s.brands.length ? ' · ' + s.brands.map(b => (G(b) || { shortName: b }).shortName).join(', ') : ''}</div>${s.note ? `<div class="src-note">${s.note}</div>` : ''}</div>`;
  const arch = DB.sources.filter(s => s.type === 'archive'), ref = DB.sources.filter(s => s.type !== 'archive');

<div class="section-title">Archives to search</div>${arch.map(card).join('')}<div class="section-title">Sources used for corrections</div>${ref.map(card).join('')}`;
}
function dvLegend() {

<p>${confBadge('verified')} Checked against the source shown beside it.<br>${confBadge('cited')} Taken from a source named in the research notes; not re-checked.<br>${confBadge('approx')} Approximate, from general knowledge. Optical systems, lineage chains and estimated discontinuation years carry this mark.</p>

function renderBinoSection(){
  return`<div class="bino-section">
<h3>👁️ Binocular &amp; Trinocular Heads: A Complete History</h3>
<p class="bino-intro">The progression from monocular to binocular to trinocular heads spans three centuries and represents one of the most important ergonomic and scientific advances in microscopy. Understanding this timeline helps collectors identify the capabilities and rarity of any antique instrument.</p>
<div class="bino-callout">
  <strong>Why binocular matters for collectors:</strong> Before the Wenham prism (1860), essentially all compound microscopes were monocular. Binocular instruments were expensive, difficult to make, and rare. A genuine Victorian Wenham binocular from a top maker (Powell &amp; Lealand, Ross, Beck, Watson) represents the pinnacle of 19th-century instrument making and commands a significant premium. Trinocular instruments from before 1960 are genuinely uncommon — the Leitz FS trinocular tube (1953) was the first widely adopted design, and pre-war examples with camera ports are exceptional finds.
</div>
<div class="tl-legend">
  <div class="tl-leg-item"><div class="tl-leg-dot" style="background:var(--amber-bright)"></div>Pioneering invention</div>
  <div class="tl-leg-item"><div class="tl-leg-dot" style="background:var(--blue)"></div>Major commercial development</div>
  <div class="tl-leg-item"><div class="tl-leg-dot" style="background:var(--purple)"></div>Trinocular / photomicrography milestone</div>
  <div class="tl-leg-item"><div class="tl-leg-dot" style="background:var(--green)"></div>Era shift / industry standard</div>
</div>
<div class="timeline">
  <div class="tl-item"><div class="tl-year">1677</div><div class="tl-dot dot-pioneer"></div><div class="tl-content"><div class="tl-title">First Binocular Microscope Concept</div><div class="tl-desc">Chérubin d'Orléans adapts the binocular telescope principle to a microscope — two complete monocular systems side by side. The image is pseudoscopic (relief appears reversed) and the design is impractical for high-power work, but the concept is established.</div><div class="tl-maker">Chérubin d'Orléans, France</div></div></div>
  <div class="tl-item"><div class="tl-year">1853</div><div class="tl-dot dot-pioneer"></div><div class="tl-content"><div class="tl-title">Riddell Prism Binocular — First Single-Objective Design</div><div class="tl-desc">Prof. John Leonard Riddell (Tulane University) presents the first binocular microscope using a single objective with a prism to split the light beam to both eyes. Still pseudoscopic, but a critical conceptual breakthrough. Nachet independently develops a similar prism binocular in Paris the same year.</div><div class="tl-maker">J.L. Riddell, New Orleans; C. Nachet, Paris</div></div></div>
  <div class="tl-item"><div class="tl-year">1860–61</div><div class="tl-dot dot-pioneer"></div><div class="tl-content"><div class="tl-title">Wenham Prism — The Dominant Victorian Binocular</div><div class="tl-desc">Francis Herbert Wenham (marine engineer turned optical adviser to Ross) presents his reflecting dividing prism to the Microscopical Society of London on 12 December 1860. The Wenham prism divides the emergent pencil of light geometrically — one half to each eye via a half-silvered prism above the objective — producing an orthoscopic (correct relief) image at medium power. Interpupillary adjustment via rack-and-pinion. This design is immediately adopted by nearly every British and American maker and remains the standard binocular arrangement for 60+ years. Converts existing monoculars from Ross, Beck, Watson, Powell &amp; Lealand.</div><div class="tl-maker">F.H. Wenham (optical adviser to Ross &amp; Co.); adopted by Smith Beck &amp; Beck, Watson, Powell &amp; Lealand, Bausch &amp; Lomb, Zentmayer</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1862</div><div class="tl-dot dot-major"></div><div class="tl-content"><div class="tl-title">First Commercial Wenham Binoculars</div><div class="tl-desc">Smith Beck &amp; Beck (formerly Smith &amp; Beck) manufacture the first commercial Universal Model binocular microscopes incorporating the Wenham prism body. Ross follows immediately. Within five years, all leading English makers offer binocular bodies. These are available as complete instruments or as conversion kits for existing monoculars. Limitation: the aperture of the objective is halved, so resolution is reduced in binocular mode.</div><div class="tl-maker">Smith Beck &amp; Beck, R. &amp; J. Beck, Andrew Ross, W. Watson &amp; Sons</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1876</div><div class="tl-dot dot-major"></div><div class="tl-content"><div class="tl-title">American Wenham Binoculars — Bausch &amp; Lomb and Zentmayer</div><div class="tl-desc">Bausch &amp; Lomb introduces the Universal Model microscope with binocular tubes, bringing the Wenham binocular to the American market at scale. Zentmayer (Philadelphia) offers his Grand American and Centennial models with binocular option. The binocular head becomes a mark of a serious research instrument in American universities and hospitals.</div><div class="tl-maker">Bausch &amp; Lomb (Rochester NY), J. Zentmayer (Philadelphia)</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1890</div><div class="tl-dot dot-pioneer"></div><div class="tl-content"><div class="tl-title">Greenough Stereo Microscope — True Stereoscopic Vision</div><div class="tl-desc">Horatio S. Greenough collaborates with Carl Zeiss (Jena) to develop a microscope with two completely separate optical paths — one per eye — angled at 10–16°. Porro prisms in each path erect the image. Unlike the Wenham (which halves aperture and gives only partial stereopsis), the Greenough gives true 3D depth perception and retains full aperture in each path. This becomes the foundation of all modern stereo microscopes. Zeiss markets it commercially in the mid-1890s.</div><div class="tl-maker">H.S. Greenough &amp; Carl Zeiss, Jena</div></div></div>
  <div class="tl-item"><div class="tl-year">1900–1910</div><div class="tl-dot dot-major"></div><div class="tl-content"><div class="tl-title">Binocular Becomes Standard on Research Instruments</div><div class="tl-desc">By the Edwardian era, a binocular head is considered essential on any serious research microscope. All major makers (Zeiss, Leitz, B&amp;L, Watson, Beck, Powell &amp; Lealand) include binocular models in their standard catalogues. Interpupillary distance (IPD) is now adjustable on most instruments. The Wenham prism design is refined but unchanged in principle. German makers (Zeiss, Leitz) begin offering alternative prism arrangements that preserve more of the objective's full aperture.</div><div class="tl-maker">All major makers; Zeiss and Leitz lead in optical refinement</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1910–1930</div><div class="tl-dot dot-major"></div><div class="tl-content"><div class="tl-title">Inclined Binocular Tubes — Ergonomics Improve</div><div class="tl-desc">The early Wenham binoculars use straight vertical tubes requiring the observer to look directly downward, causing neck strain. The transition era sees the introduction of inclined binocular heads (typically 30° or 45°), first on German instruments (Zeiss, Leitz) then adopted universally. This is a major ergonomic improvement enabling extended microscopy sessions. The inclined binocular head at 45° becomes the universal standard for research instruments.</div><div class="tl-maker">Carl Zeiss (Jena), E. Leitz (Wetzlar), Bausch &amp; Lomb</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1930s</div><div class="tl-dot dot-major"></div><div class="tl-content"><div class="tl-title">Fixed vs. Adjustable IPD — Modern Head Ergonomics</div><div class="tl-desc">Early binocular heads had limited interpupillary distance (IPD) adjustment — the tube separation was altered by physically sliding tubes. Modern binocular heads introduce smooth, wide-range IPD adjustment (typically 48–75mm) via a rotating hinge mechanism, diopter adjustment on both eyepiece tubes, and matched eyepiece parfocality. This is the design used on all modern research microscopes and first appears on top-tier instruments from Zeiss and Leitz in the 1930s.</div><div class="tl-maker">Carl Zeiss Jena, E. Leitz Wetzlar</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1850–1940</div><div class="tl-dot dot-trinocular"></div><div class="tl-content"><div class="tl-title">Photomicrography Before Trinoculars — Adapter Methods</div><div class="tl-desc">Before dedicated trinocular ports, photomicrography was accomplished by replacing an eyepiece with a camera bellows adapter, or using a separate vertical photographic tube alongside the binocular head. The Leitz Aristophot stand (introduced 1941) became the industry standard for photomicrography using this approach — a dedicated photographic column with the binocular head for simultaneous viewing and photography using a beam-splitting arrangement.</div><div class="tl-maker">E. Leitz (Aristophot, 1941), Carl Zeiss, Bausch &amp; Lomb</div></div></div>
  <div class="tl-item"><div class="tl-year">c.1953</div><div class="tl-dot dot-trinocular"></div><div class="tl-content"><div class="tl-title">Leitz FS Trinocular Tube — First Practical Trinocular Standard</div><div class="tl-desc">Ernst Leitz Wetzlar introduces the FS (Foto-Schnellwechsel, "fast photo change") trinocular tube, providing a dedicated third vertical port for a camera while both eyepieces remain in use. A beam-splitting prism divides light: typically 80% to eyepieces, 20% to the camera port (or switched 100% to camera via lever). This becomes the <em>de facto</em> standard that all subsequent makers follow. Zeiss, Nikon, Olympus, and B&amp;L all introduce comparable trinocular heads within five years.</div><div class="tl-maker">Ernst Leitz Wetzlar (FS trinocular); Carl Zeiss, Nikon follow c.1955–1960</div></div></div>
  <div class="tl-item"><div class="tl-year">1955–1965</div><div class="tl-dot dot-era"></div><div class="tl-content"><div class="tl-title">Industry-Wide Trinocular Adoption</div><div class="tl-desc">The trinocular head becomes standard on all research-grade instruments from every major maker. Zeiss, Nikon, Olympus, and Bausch &amp; Lomb all introduce research stands with trinocular heads. The 35mm SLR camera adapts directly to the camera port. This era marks the beginning of systematic photomicrographic documentation in research. Instruments from this period (Zeiss Standard WL trinocular, Leitz Ortholux trinocular, Nikon S trinocular) represent the earliest practically accessible vintage trinoculars.</div><div class="tl-maker">All major makers — Zeiss (Standard WL), Leitz (Ortholux), Nikon (S series), Olympus (BH), B&amp;L</div></div></div>
</div>
</div>`;
}

function renderAntiqueGrid(){
  const F=AG.filters;
  let html='';
  for(const era of AG.eras){
    if(!era.items)continue;
    if(F.era!=='all'&&F.era!==era.id)continue;
    let rows=era.items.filter(i=>{
      if(F.origin!=='All'&&i.origin!==F.origin)return false;
      if(F.value!=='All'){
        const v=i.valueBand;
        if(F.value==='Under $500'&&v!=='low')return false;
        if(F.value==='$500–$2k'&&v!=='mid')return false;
        if(F.value==='$2k–$10k'&&v!=='high')return false;
        if(F.value==='$10k+'&&v!=='ultra')return false;
      }
      if(F.head!=='All'){
        if(F.head==='Monocular only'&&!i.heads.includes('mono'))return false;
        if(F.head==='Binocular available'&&!i.heads.includes('bino'))return false;
        if(F.head==='Binocular dedicated'&&(i.heads.includes('mono')||!i.heads.includes('bino')))return false;
        if(F.head==='Trinocular available'&&!i.heads.includes('tri'))return false;
      }
      return true;
    });
    if(!rows.length)continue;
    const rarityLbl={common:'Common',scarce:'Scarce',rare:'Rare',exceptional:'Exceptional'};
    const valCls={low:'v-low',mid:'v-mid',high:'v-high',ultra:'v-ultra'};
    const headLabels={'mono':'Monocular','bino':'Wenham Bino','bino-only':'Bino Dedicated','stereo':'Stereo','tri':'Trinocular'};
    const headCls={'mono':'ht-mono','bino':'ht-bino','bino-only':'ht-bino-only','stereo':'ht-stereo','tri':'ht-tri'};
    html+=`<div class="era-section">
<div class="era-header"><span class="era-icon">${era.icon}</span><div><div class="era-title">${era.title}</div><div class="era-sub">${era.sub}</div></div><span class="era-count">${rows.length} instrument${rows.length!==1?'s':''}</span></div>
<div class="antique-table-wrap"><table class="antique-table">
<thead><tr><th>Maker</th><th>Model / Series</th><th>Origin</th><th>Years</th><th>Head Type(s)</th><th>Construction</th><th>Key Features &amp; Significance</th><th>Rarity</th><th>Est. Value (complete)</th></tr></thead>
<tbody>${rows.map(i=>`<tr>
<td><div class="at-maker">${i.maker}</div></td>
<td><div class="at-model">${i.model}</div></td>
<td class="at-origin"><span class="flag-sm">${i.flag}</span>${i.origin}</td>
<td class="at-years">${i.years}</td>
<td><div class="headtype-pills">${(i.heads||['mono']).map(h=>`<span class="ht-pill ${headCls[h]||'ht-mono'}">${headLabels[h]||h}</span>`).join('')}</div></td>
<td><span style="font-size:.87rem;color:var(--text2)">${i.construction}</span></td>
<td class="at-features">${i.features}</td>
<td><span class="rarity-pill r-${i.rarity}">${rarityLbl[i.rarity]}</span></td>
<td><span class="value-range ${valCls[i.valueBand]}">${i.value}</span></td>
</tr>`).join('')}
</tbody></table></div></div>`;
  }
  if(!html)html=`<div class="empty-state"><h3>No instruments match</h3><p>Try adjusting the filters above.</p></div>`;
  return html;
}

const AF={
