  ['', 'Older finite (160 / 170 mm)', ['Achromat (all makers), Nikon CF Achromat, Olympus A', 'Zeiss Planachromat, Leitz NPL, Nikon CF Plan, Olympus D Plan', 'Zeiss Neofluar, Leitz Fluotar, Nikon CF Fluor', 'Zeiss Planapo, Leitz PL Apo, Nikon CF Plan Apo, Olympus S Plan Apo', 'Zeiss LD Achroplan, Nikon CF LWD, Olympus LWD CDPlan', 'Zeiss W (water) Achroplan, Leitz W']]
];
const OBJ_NA = [['Achromat', ['0.10', '0.25', '0.40', '0.65', '1.25 oil']], ['Plan fluorite', ['0.13', '0.30', '0.50', '0.75', '1.30 oil']], ['Plan apochromat', ['0.16–0.20', '0.40–0.45', '0.75–0.80', '0.95', '1.40–1.45 oil']]];

// ── Köhler and cleaning ──
const KOHLER_STEPS = [
  ['Focus a specimen', 'Put a slide on the stage, swing in the 10x objective and focus. Open the condenser aperture diaphragm fully and raise the condenser close to the slide.'],
  ['Close the field diaphragm', 'Close the iris in the base until you see its edge as a small polygon in the field. If the stand has no field diaphragm, it uses fixed or pre-set Köhler and you can skip to step 5.'],
  ['Focus the condenser', 'Move the condenser up or down until the edges of the polygon are sharp. A thin colored fringe is normal.'],
  ['Center the condenser', 'Use the two condenser centering screws to move the polygon to the middle of the field, then open the field diaphragm until its edges just disappear past the field of view.'],
  ['Set the aperture diaphragm', 'Remove one eyepiece (or use a phase telescope) and look down the tube at the bright disk of the objective’s back aperture. Close the aperture diaphragm until it fills about 70 to 80 percent of the disk. Without removing an eyepiece, close it until the image just gains contrast without going grainy.'],
  ['Adjust brightness with the lamp', 'Use the lamp control or neutral density filters for brightness, never the aperture diaphragm.'],
  ['Repeat for each objective', 'Reopen or close the field diaphragm to match the new field of view and reset the aperture diaphragm for the new NA. For 2.5x to 4x objectives, swing out the condenser top lens if it has one.']
];
const CLEAN_STEPS = [
  ['Remove dust first', 'Blow loose dust off with a hand bulb blower. Never use canned air close up (it can spit propellant) and never blow with your mouth.'],
  ['Brush if needed', 'Lift remaining dust with a soft, clean camel-hair or lens brush kept only for optics.'],
  ['Wipe with lens tissue and a little cleaner', 'Fold lens tissue or use a lint-free swab, wet it slightly with lens cleaning solution (not dripping), and wipe in a spiral from the center out. Use a fresh piece each pass. Water-soluble dirt comes off with distilled water first.'],
  ['Remove immersion oil after every session', 'Wipe oil from the 100x objective and the slide with dry lens tissue, then a tissue lightly wet with cleaner. Check that no oil has crept onto the 40x dry objective, a common cause of a hazy 40x.'],
  ['Find where the dirt is', 'Rotate an eyepiece while looking: if the specks turn, they are in the eyepiece. If they move with the slide, they are on the slide. If they stay put, check the objective front lens with an eyepiece held backward as a magnifier, then the camera port or condenser.'],
  ['Clean the eyepieces and condenser', 'Eyepiece top lenses collect skin oil and mascara; clean them the same way. The condenser top lens and the field lens in the base collect dust.']
];
const CLEAN_AVOID = ['Paper towels, facial tissue or clothing: they scratch coatings.', 'Strong solvents such as acetone on lens mounts, plastic parts or cemented lenses; use only what the maker recommends.', 'Taking objectives apart: their elements are aligned at the factory.', 'Spraying cleaner directly on a lens: it seeps into the mount.', 'Storing without a dust cover, or in a damp room: fungus grows in humid, still air. A dust cover and a dry, ventilated room prevent most problems.'];

const LEARN_TABS = [['glossary', 'Glossary'], ['kohler', 'Köhler setup'], ['cleaning', 'Cleaning optics'], ['objectives', 'Objectives catalog']];
const LN = { tab: 'glossary', q: '' };
function renderLearn(main) {
  if (S.tab && LEARN_TABS.some(t => t[0] === S.tab)) LN.tab = S.tab;
  const body = { glossary: learnGlossary, kohler: learnKohler, cleaning: learnCleaning, objectives: learnObjectives }[LN.tab]();
  main.innerHTML = `<div class="view mdb-learn"><div class="mdb-page-head"><h2>Learn</h2><p>Terms, setup and care: the basics behind every specification in the database. Ready to explore pond and moss life? The <a class="mdb-xlink" href="https://beneathtrees.org/Microscopy_Guide/" target="_blank" rel="noopener">Microscopic Life Field Guide</a> has a beginner’s path, sampling methods and an ID helper.</p></div>
  <div class="mdb-chips mdb-learn-tabs" role="tablist">${LEARN_TABS.map(t => `<button type="button" role="tab" class="mdb-chip${LN.tab === t[0] ? ' on' : ''}" aria-selected="${LN.tab === t[0]}" onclick="nav('#/learn/${t[0]}')">${t[1]}</button>`).join('')}</div>
  <div id="learn-body">${body}</div></div>`;
}
function glossList() {
  const t = tokens(LN.q), list = MDB_GLOSSARY.filter(g => !t.length || t.every(x => (g[0] + ' ' + g[1]).toLowerCase().includes(x)));
  return list.length ? `<dl class="mdb-gloss">${list.map(g => `<dt id="g-${g[0].toLowerCase().replace(/[^a-z]+/g, '-')}">${g[0]}</dt><dd>${g[1]}</dd>`).join('')}</dl>` : '<div class="mdb-empty">No term matches. Try a shorter word.</div>';
}
function learnGlossary() {
  return `<div class="mdb-help-sec"><label class="mdb-f">Find a term<input type="search" value="${esc(LN.q)}" placeholder="e.g. aperture, phase, parfocal" oninput="LN.q=this.value;document.getElementById('gloss-out').innerHTML=glossList()"></label>
  <div id="gloss-out">${glossList()}</div><p class="mdb-learn-note">Markings on a real objective? Paste them into the <a onclick="nav('#/decoder')">Objective decoder</a>.</p></div>`;
}
const stepList = a => `<ol class="mdb-steps">${a.map(s => `<li><b>${s[0]}</b><p>${s[1]}</p></li>`).join('')}</ol>`;
function learnKohler() {
  return `<div class="mdb-help-sec"><h3>Setting up Köhler illumination</h3><p class="mdb-learn-note">Köhler illumination gives an evenly lit field and the full resolution of each objective. It takes about a minute once you know it. You need a stand with a focusing, centerable condenser and a field diaphragm; many student microscopes have neither and are set at the factory.</p>${stepList(KOHLER_STEPS)}</div>
  <div class="mdb-help-sec"><h3>Signs it is wrong</h3><ul class="mdb-list"><li>Uneven brightness, or the lamp filament visible in the image: the condenser is too low or off-center.</li><li>Flat, washed-out image of unstained cells: aperture diaphragm too open.</li><li>Grainy image with dark rings around edges: aperture diaphragm closed too far.</li><li>Phase contrast or darkfield needs the condenser centered first, then the phase annuli centered with a phase telescope.</li></ul></div>`;
}
function learnCleaning() {
  return `<div class="mdb-help-sec"><h3>Cleaning optics safely</h3><p class="mdb-learn-note">Work from the gentlest method up, and stop as soon as the lens is clean.</p>${stepList(CLEAN_STEPS)}</div>
  <div class="mdb-help-sec"><h3>Avoid</h3><ul class="mdb-list">${CLEAN_AVOID.map(x => `<li>${x}</li>`).join('')}</ul></div>
  <div class="mdb-help-sec"><h3>Fungus and haze</h3><ul class="mdb-list"><li>Fungus looks like fine cobwebs or spots inside a lens. Light surface growth can sometimes be cleaned; growth that has etched the coating cannot.</li><li>Haze inside an older objective can be separation of cemented elements; it needs a specialist.</li><li>Buying used? See the <a onclick="nav('#/buying')">used-buying checklist</a>.</li></ul></div>`;
}
function learnObjectives() {
  const cnt = id => id ? (G(id) ? G(id).models.length : 0) : 0;
  return `<div class="mdb-help-sec"><h3>Correction classes</h3><div class="mdb-tscroll"><table class="mdb-table"><thead><tr><th>Class</th><th>What is corrected</th><th>Best for</th></tr></thead><tbody>${OBJ_CLASSES.map(c => `<tr><th scope="row">${c[0]}</th><td data-l="What is corrected">${c[1]}</td><td data-l="Best for">${c[2]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="mdb-help-sec"><h3>What each maker calls them</h3><p class="mdb-learn-note">Product line names for each class. ${confBadge('approx')} From general knowledge of the catalogs; check the maker’s current catalog before buying.</p>
  <div class="mdb-tscroll"><table class="mdb-table mdb-objcat"><thead><tr><th>Maker</th>${OBJ_CLASSES.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${OBJ_LINES.map(l => `<tr><th scope="row">${l[0] ? `<a onclick="selCo('${l[0]}')">${l[1]}</a><small>${cnt(l[0])} models</small>` : l[1]}</th>${l[2].map((x, i) => `<td data-l="${OBJ_CLASSES[i][0]}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="mdb-help-sec"><h3>Typical numerical apertures</h3><p class="mdb-learn-note">Usual values for each magnification; individual objectives vary. ${confBadge('approx')}</p>
  <div class="mdb-tscroll"><table class="mdb-table"><thead><tr><th>Class</th><th>4x</th><th>10x</th><th>20x</th><th>40x</th><th>100x</th></tr></thead><tbody>${OBJ_NA.map(r => `<tr><th scope="row">${r[0]}</th>${r[1].map((v, i) => `<td data-l="${['4x', '10x', '20x', '40x', '100x'][i]}">${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
  <div class="mdb-quick"><button type="button" class="btn btn-primary" onclick="nav('#/decoder')">Objective decoder</button><button type="button" class="btn btn-outline" onclick="nav('#/fit')">Will it fit?</button></div>`;
}
MDB_TOOL_GROUPS.push(['learn', 'Learn']);
mdbRegisterTool({ id: 'learn-glossary', icon: '📖', title: 'Glossary', blurb: 'Plain explanations of the terms used in specifications, from numerical aperture to parfocal distance.', route: '#/learn/glossary', group: 'learn' });
mdbRegisterTool({ id: 'learn-kohler', icon: '💡', title: 'Köhler setup', blurb: 'Step-by-step transmitted-light setup for an evenly lit, sharp image.', route: '#/learn/kohler', group: 'learn' });
mdbRegisterTool({ id: 'learn-cleaning', icon: '🧽', title: 'Cleaning optics', blurb: 'How to clean lenses safely, find where the dirt is, and prevent fungus.', route: '#/learn/cleaning', group: 'learn' });
mdbRegisterTool({ id: 'learn-objectives', icon: '🎯', title: 'Objectives catalog', blurb: 'Correction classes, what each maker calls them, and typical numerical apertures.', route: '#/learn/objectives', group: 'learn' });
</script>
<script data-file="js/router.js">
// ROUTER — every page has a URL (#/brand/zeiss, #/model/zeiss/zeiss-axioplan, #/compare?m=…), so pages can be linked, bookmarked and used with the back button.
function parseHash(h) {
  h = (h || '').replace(/^#\/?/, ''); const [path, query = ''] = h.split('?');
  const p = path.split('/').filter(Boolean).map(decodeURIComponent), q = new URLSearchParams(query);
  if (!p.length) return { view: 'home' };
  switch (p[0]) {
    case 'browse': return { view: 'browse' };
    case 'brand': return { view: 'browse', co: p[1] };
    case 'model': return { view: 'browse', co: p[1], model: p[2], modal: true };
    case 'compare': return { view: 'compare', items: (q.get('m') || '').split(',').filter(Boolean).map(s => { const [c, m] = s.split(':'); return { c, m }; }) };
    case 'data': return { view: 'data', tab: p[1] || 'review', brand: q.get('brand') || '' };
    case 'oem': case 'guide': case 'collection': case 'tools': case 'help': case 'search': case 'finder': case 'decoder': case 'fit': case 'identify': case 'serials': case 'buying': case 'history': return { view: p[0] };
    case 'learn': return { view: 'learn', tab: p[1] || 'glossary' };
    default: return { view: 'home' };
  }
}
const compareHash = () => '#/compare' + (S.cmp.length ? '?m=' + S.cmp.map(i => i.c + ':' + i.m).join(',') : '');
function nav(hash) { if (location.hash === hash || (!location.hash && hash === '#/')) applyRoute(); else location.hash = hash; }
function syncCompareHash() { if (S.view === 'compare') history.replaceState(null, '', compareHash()); }
function paintTabs() { document.querySelectorAll('.header-tab').forEach(t => t.classList.remove('active')); const t = document.getElementById('tab-' + ({ oem: 'tools', guide: 'tools', data: 'tools', help: 'tools', search: 'tools', finder: 'tools', decoder: 'tools', fit: 'tools', identify: 'tools', serials: 'tools', buying: 'tools', history: 'tools', learn: 'tools' }[S.view] || S.view)); if (t) t.classList.add('active'); }

function render() {
  renderSidebar();
  const main = document.getElementById('main');
  if (S.view === 'home') renderHome(main);
  else if (S.view === 'browse') { S.co ? renderCo(main) : renderBrowseLanding(main); }
  else if (S.view === 'compare') renderCompare(main);
  else if (S.view === 'oem') renderOEM(main);
  else if (S.view === 'guide') renderGuide(main);
  else if (S.view === 'collection') renderCollection(main);
  else if (S.view === 'data') renderData(main);
  else if (S.view === 'tools') renderTools(main);
  else if (S.view === 'help') renderHelp(main);
  else if (S.view === 'search') renderSearch(main);
  else if (S.view === 'finder') renderFinder2(main);
  else if (S.view === 'decoder') renderDecoder(main);
  else if (S.view === 'fit') renderFit(main);
  else if (S.view === 'identify') renderIdentify(main);
  else if (S.view === 'serials') renderSerials(main);
  else if (S.view === 'buying') renderBuying(main);
  else if (S.view === 'history') renderHistory(main);
  else if (S.view === 'learn') renderLearn(main);
  updateTray();
  mdbFillPhotos(main);
}
function hideModal() { document.getElementById('model-modal').classList.remove('open'); S.modal = null; }

function applyRoute() {
  const r = parseHash(location.hash), main = document.getElementById('main');
  if (r.co && !G(r.co)) { r.co = null; r.modal = false; }
  if (r.modal && !GM(r.co, r.model)) r.modal = false;
  if (r.view === 'compare' && r.items && r.items.length) { S.cmp = r.items.filter(i => GM(i.c, i.m)).slice(0, 4); updateTray(); updateBadge(); }
  if (isMobile()) closeSidebar();
  if (r.modal) {
    if (!S.rendered) { S.view = 'browse'; S.co = r.co; S.baseHash = '#/brand/' + r.co; render(); }
    S.modal = { c: r.co, m: r.model }; showModal(r.co, r.model);
  } else {
    // Closing a model window returns to the page underneath without redrawing it (keeps the scroll position).
    if (S.modal && S.rendered && (location.hash || '#/') === S.baseHash) { hideModal(); paintTabs(); return; }
    S.baseHash = location.hash || '#/';
    S.view = r.view; if (r.view === 'browse') S.co = r.co || null;
    if (r.view === 'data') S.dv = { tab: r.tab || 'review', brand: r.brand || '' };
    S.tab = r.view === 'learn' ? r.tab : null;
    hideModal(); render(); main.scrollTop = 0;
  }
  S.rendered = true; paintTabs(); mdbNavPaint();
}

// ---- navigation actions used by buttons and links ----
function setView(v) { nav(v === 'home' ? '#/' : v === 'browse' ? (S.co ? '#/brand/' + encodeURIComponent(S.co) : '#/browse') : v === 'compare' ? compareHash() : '#/' + v); }
function goHome() { S.co = null; nav('#/'); }
function selCo(id) { S.mf = 'all'; nav('#/brand/' + encodeURIComponent(id)); }
function openModal(cid, mid) { nav('#/model/' + encodeURIComponent(cid) + '/' + encodeURIComponent(mid)); }
function closeModal(e) {
  if (e && e.target !== document.getElementById('model-modal')) return;
  if (S.modal) nav(S.baseHash || '#/browse'); else hideModal();
}
function setCat(c) { S.cat = c; document.querySelectorAll('#cat-filters .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === c)); refreshMain(); }
function setSt(s) { S.st = s; document.querySelectorAll('#st-filters .filter-btn').forEach(b => b.classList.toggle('active', b.dataset.st === s)); refreshMain(); }
function setMF(t) { S.mf = t; renderCo(document.getElementById('main')); }

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.classList.add('show'), 10); setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 1800);
}
function copyLink() {
  const url = location.href;
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(() => toast('Link copied'), () => window.prompt('Copy this link:', url));
  else window.prompt('Copy this link:', url);
}

</script>
<script data-file="js/main.js">
// BOOT — load the data files listed in data/manifest.js, build the indexes, then start the router.
MDB.loadData = function (done) {
  if (MDB.inlined) return done([]);                       // standalone build: everything is already in the page
  const list = [...MDB.manifest.brands.map(b => `data/brands/${b}.js`), ...MDB.manifest.datasets.map(d => `data/${d}.js`)];
  const failed = []; let pending = list.length;
  list.forEach(src => {
    const s = document.createElement('script'); s.src = src; s.async = false;   // async=false keeps the listed order
    s.onload = () => { if (!--pending) done(failed); };
    s.onerror = () => { failed.push(src); if (!--pending) done(failed); };
    document.head.appendChild(s);
  });
};
MDB.fail = function (failed) {
  const where = location.href.replace(/[#?].*$/, '');
  document.getElementById('sidebar').innerHTML = '';
  document.getElementById('main').innerHTML = `<div class="load-error"><strong>MicroscopeDB could not load its data files.</strong><br><br>
${failed.length ? `Missing (${failed.length}): <code>${failed.slice(0, 6).join('</code>, <code>')}</code>${failed.length > 6 ? ` and ${failed.length - 6} more` : ''}<br><br>` : 'The data loaded but contained no brands.<br><br>'}
This page is at <code>${where}</code>. Check that:<br>
• the <b>whole</b> folder is together: <code>index.html</code> plus the <code>css/</code>, <code>js/</code> and <code>data/</code> folders, with the folder names unchanged;<br>
• on GitHub, all of those folders were uploaded to the same branch and Pages is serving that branch (file names are case-sensitive; keep the <code>.nojekyll</code> file in the repository root);<br>
• or use <code>MicroscopeDB_standalone.html</code>, which needs no other files.</div>`;
};
MDB.start = function () {
  MDB.derive();
  renderFeatureChips();
  const foot = document.getElementById('sidebar-foot');
  if (foot) foot.innerHTML = `<a onclick="nav('#/data')">📋 Data notes</a><span>v${MDB.version} · ${DB.companies.reduce((s, c) => s + c.models.length, 0)} models · data ${MDB.built}</span>`;
  mdbNavInit();
  window.addEventListener('hashchange', applyRoute);
  window.addEventListener('resize', () => { if (!isMobile()) closeSidebar(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) closeModal(); });
  applyRoute();
};
MDB.loadData(failed => { if (failed.length || !DB.companies.length) MDB.fail(failed); else MDB.start(); });

</script>
