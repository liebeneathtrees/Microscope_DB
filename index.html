<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroscopeDB — Microscope Reference Database</title>
<meta name="description" content="A reference database of microscope makers and models: specifications, price ranges, optical systems, lineage and corporate history for 21 brands from Zeiss and Leica to historical makers.">
<meta property="og:type" content="website">
<meta property="og:title" content="MicroscopeDB — Microscope Reference Database">
<meta property="og:description" content="A reference database of microscope makers and models: specifications, price ranges, optical systems, lineage and corporate history for 21 brands from Zeiss and Leica to historical makers.">
<meta property="og:url" content="https://liebeneathtrees.github.io/Microscope_DB/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#1a3a5c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%AC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="header">
  <button class="hamburger" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Toggle menu">
    <span></span>
  </button>
  <a class="logo" onclick="goHome()" href="javascript:void(0)">🔬 Micro<span>Scope</span>DB</a>
  <div class="search-wrap">
    <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="global-search" placeholder="Search companies, models, specs…" oninput="handleSearch(this.value)">
  </div>
  <div class="header-tabs">
    <button class="header-tab" onclick="setView('browse')" id="tab-browse">Browse</button>
    <button class="header-tab" onclick="setView('compare')" id="tab-compare">Compare <span class="badge" id="cmp-badge" style="display:none">0</span></button>
    <button class="header-tab" onclick="setView('oem')" id="tab-oem">🌎 Industry Genealogy</button>
    <button class="header-tab" onclick="setView('guide')" id="tab-guide">🏛️ Antique Guide</button>
    <button class="header-tab" onclick="setView('collection')" id="tab-collection">🔬 My Collection</button>
  </div>
</div>
<div id="sidebar-backdrop" onclick="closeSidebar()"></div>
<div id="layout">
  <aside id="sidebar">
    <div class="sidebar-filters">
      <div class="filter-row" id="cat-filters">
        <button class="filter-btn active" onclick="setCat('all')" data-cat="all">All</button>
        <button class="filter-btn" onclick="setCat('compound')" data-cat="compound">Compound</button>
        <button class="filter-btn" onclick="setCat('stereo')" data-cat="stereo">Stereo</button>
      </div>
      <div class="filter-row" id="st-filters">
        <button class="filter-btn active" onclick="setSt('all')" data-st="all">All</button>
        <button class="filter-btn" onclick="setSt('active')" data-st="active">Active</button>
        <button class="filter-btn" onclick="setSt('historical')" data-st="historical">Historical</button>
      </div>
      <div class="ft-label">Must have</div>
      <div class="ft-row" id="ft-filters"></div>
    </div>
    <div class="sidebar-list" id="company-list"></div>
    <div class="sidebar-foot" id="sidebar-foot"></div>
  </aside>
  <main id="main"><noscript><div class="load-error"><strong>MicroscopeDB needs JavaScript.</strong><br>Please enable it for this page.</div></noscript></main>
</div>
<div id="compare-tray">
  <span class="tray-label">Comparing:</span>
  <div class="tray-items" id="tray-items"></div>
  <button class="tray-cmp" onclick="setView('compare')">View Comparison →</button>
</div>
<div class="modal-overlay" id="model-modal" onclick="closeModal(event)">
  <div class="modal-box" id="modal-box"></div>
</div>
<script src="data/core.js"></script>
<script src="data/manifest.js"></script>
<script src="js/util.js"></script>
<script src="js/search.js"></script>
<script src="js/sections.js"></script>
<script src="js/mylist.js"></script>
<script src="js/browse.js"></script>
<script src="js/modal.js"></script>
<script src="js/compare.js"></script>
<script src="js/pages.js"></script>
<script src="js/data-view.js"></script>
<script src="js/guide.js"></script>
<script src="js/mobile.js"></script>
<script src="js/router.js"></script>
<script src="js/main.js"></script>
</body>
</html>
